# Secret-scanning guardrails — blocks a commit that would leak an API key/token.
# Setup (once):
#   pip install -r apps/api/requirements-dev.txt
#   pre-commit install
# Run on demand across the repo:  pre-commit run --all-files
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '(^|/)(node_modules|\.venv|venv|dist|build)/|(^|/)package-lock\.json$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
