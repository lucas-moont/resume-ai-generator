name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  # Lets the opt-in `e2e` job below be triggered on demand from the Actions
  # tab ("Run workflow") without adding a push/pull_request trigger for it.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      # @e2e (real Playwright/Chromium PDF render) is opt-in and runs in the
      # separate `e2e` job below -- see apps/api/pyproject.toml's marker docstring.
      - run: python -m pytest -m "not e2e"

  e2e:
    # Opt-in only: exercises a real headless-Chromium PDF render via
    # Playwright. Does not block push/PR -- run it manually from the
    # Actions tab ("Run workflow") when you need to validate PDF export.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-py-${{ runner.os }}-${{ hashFiles('apps/api/requirements.txt') }}

      - run: python -m playwright install chromium --with-deps
      - run: python -m pytest -m e2e
